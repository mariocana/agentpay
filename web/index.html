<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentPay on Arc</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #171a21; --text: #e6e8ec; --muted: #9aa3b2; --line: #262a33; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 24px 16px 8px; max-width: 1080px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin: 0; }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 16px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .mono { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  th { border-top: 0; color: var(--muted); font-weight: 500; font-size: 13px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); }
  .Open { color: var(--muted); } .Funded { color: var(--warn); } .Submitted { color: var(--accent); }
  .Completed { color: var(--ok); } .Rejected, .Expired { color: var(--bad); }
  .desc { max-width: 420px; }
  details summary { cursor: pointer; color: var(--accent); }
  pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  input { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; min-width: 0; }
  input.addr { flex: 1 1 320px; font-family: var(--mono); font-size: 13px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .feed { list-style: none; padding: 0; margin: 0; }
  .feed li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .feed li:first-child { border-top: 0; }
  .time { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-right: 8px; }
  .err { color: var(--bad); }
  @media (max-width: 640px) { .desc { max-width: 200px; } th:nth-child(5), td:nth-child(5) { display: none; } }
</style>
</head>
<body>
<header>
  <h1>AgentPay <span class="sub" id="netlabel"></span></h1>
  <p class="sub">AI agents hiring AI agents: ERC-8183 escrowed jobs paid in USDC, ERC-8004 identity &amp; reputation, on Arc.</p>
</header>
<main>
  <form id="filters">
    <input class="addr" name="provider" placeholder="Filter by provider address (worker)" />
    <input name="agent" placeholder="ERC-8004 agent id" style="width:150px" />
    <input name="worker" placeholder="Worker URL (deliverables)" style="width:230px" />
    <button type="submit">Apply</button>
  </form>

  <div class="grid">
    <div class="card"><div class="k">ERC-8183 contract</div><div class="mono" id="contract"></div></div>
    <div class="card"><div class="k">Jobs shown</div><div class="v" id="count">–</div></div>
    <div class="card"><div class="k">USDC paid out</div><div class="v" id="paid">–</div></div>
    <div class="card"><div class="k">Worker reputation</div><div class="v" id="rep">–</div><div class="sub" id="repsub"></div></div>
  </div>

  <div id="status" class="sub"></div>

  <table>
    <thead><tr><th>#</th><th>Status</th><th class="desc">Task</th><th>Budget</th><th>Client → Provider</th><th>Deliverable</th></tr></thead>
    <tbody id="jobs"></tbody>
  </table>

  <h3>Live events</h3>
  <div class="card"><ul class="feed" id="feed"></ul></div>
</main>

<script type="module">
import { createPublicClient, http, formatUnits, parseAbi, keccak256, toHex } from "https://esm.sh/viem@2";
import { arc, arcTestnet } from "https://esm.sh/viem@2/chains";

const q = new URLSearchParams(location.search);
const network = q.get("network") === "mainnet" ? "mainnet" : "testnet";
const chain = network === "mainnet" ? arc : arcTestnet;
const explorer = chain.blockExplorers.default.url;
const CONTRACT = q.get("contract") ?? (network === "testnet" ? "0x0747EEf0706327138c69792bF28Cd525089e4583" : "");
const IDENTITY = network === "testnet" ? "0x8004A818BFB912233c491871b3d84c89A494BD9e" : "0x8004A169FB4a3325136EB29fA0ceB6D2e539a432";
const REPUTATION = network === "testnet" ? "0x8004B663056A597Dffe9eCcC1965A193B7388713" : "0x8004BAa17C55a88189AE136b182e5fdA19dE9b63";
// ~0.5s blocks; 24h ≈ 170k blocks. RPC caps eth_getLogs at <10k blocks per call, so we scan in chunks.
const LOOKBACK = BigInt(q.get("lookback") ?? 60000); // ≈ 8h
const CHUNK = 5000n;
const STATUS = ["Open", "Funded", "Submitted", "Completed", "Rejected", "Expired"];

const acpAbi = parseAbi([
  "function getJob(uint256) view returns ((uint256 id,address client,address provider,address evaluator,string description,uint256 budget,uint256 expiredAt,uint8 status,address hook))",
  "event JobCreated(uint256 indexed jobId, address indexed client, address indexed provider, address evaluator, uint256 expiredAt, address hook)",
  "event BudgetSet(uint256 indexed jobId, uint256 amount)",
  "event JobFunded(uint256 indexed jobId, address indexed client, uint256 amount)",
  "event JobSubmitted(uint256 indexed jobId, address indexed provider, bytes32 deliverable)",
  "event JobCompleted(uint256 indexed jobId, address indexed evaluator, bytes32 reason)",
  "event JobRejected(uint256 indexed jobId, address indexed rejector, bytes32 reason)",
  "event PaymentReleased(uint256 indexed jobId, address indexed provider, uint256 amount)",
  "event Refunded(uint256 indexed jobId, address indexed client, uint256 amount)",
]);
const repAbi = parseAbi(["function getSummary(uint256 agentId, address[] clientAddresses, string tag1, string tag2) view returns (uint64 count, int128 summaryValue, uint8 summaryValueDecimals)"]);
const idAbi = parseAbi(["function tokenURI(uint256) view returns (string)", "function ownerOf(uint256) view returns (address)"]);

const client = createPublicClient({ chain, transport: http() });
const $ = (id) => document.getElementById(id);
const short = (a) => a ? `${a.slice(0, 6)}…${a.slice(-4)}` : "";
const addrLink = (a) => `<a class="mono" href="${explorer}/address/${a}" target="_blank">${short(a)}</a>`;
const txLink = (h, label = "tx") => `<a href="${explorer}/tx/${h}" target="_blank">${label}</a>`;

$("netlabel").textContent = `· Arc ${network} (chain ${chain.id})`;
$("contract").innerHTML = CONTRACT ? `<a href="${explorer}/address/${CONTRACT}" target="_blank">${CONTRACT}</a>` : "set ?contract=0x…";
const form = $("filters");
for (const k of ["provider", "agent", "worker"]) form.elements[k].value = q.get(k) ?? (k === "worker" ? "http://localhost:8787" : "");
form.onsubmit = (e) => { e.preventDefault(); const p = new URLSearchParams(q); for (const k of ["provider","agent","worker"]) { const v = form.elements[k].value.trim(); v ? p.set(k, v) : p.delete(k); } location.search = p.toString(); };

const provider = q.get("provider")?.toLowerCase() || null;
const workerUrl = (q.get("worker") ?? "http://localhost:8787").replace(/\/$/, "");
const jobs = new Map(); // id -> { job, deliverable, txs }
const feed = [];

function pushFeed(ev, blockNumber, hash) {
  const label = { JobCreated: "created", BudgetSet: "quoted", JobFunded: "funded", JobSubmitted: "submitted", JobCompleted: "completed", JobRejected: "rejected", PaymentReleased: "paid", Refunded: "refunded" }[ev.eventName] ?? ev.eventName;
  const extra = ev.args.amount !== undefined ? ` ${formatUnits(ev.args.amount, 6)} USDC` : "";
  feed.unshift(`<li><span class="time">#${blockNumber}</span> job ${ev.args.jobId} <b>${label}</b>${extra} · ${txLink(hash)}</li>`);
  $("feed").innerHTML = feed.slice(0, 40).join("");
}

async function refreshJob(id, deliverableHash) {
  const j = await client.readContract({ address: CONTRACT, abi: acpAbi, functionName: "getJob", args: [id] });
  const entry = jobs.get(id.toString()) ?? { deliverable: null, hash: null };
  entry.job = j;
  if (deliverableHash) entry.hash = deliverableHash;
  if (entry.hash && !entry.deliverable) {
    try {
      const r = await fetch(`${workerUrl}/deliverables/${entry.hash}`);
      if (r.ok) { const d = await r.json(); entry.deliverable = d; entry.verified = d.hash === entry.hash; }
    } catch {}
  }
  jobs.set(id.toString(), entry);
  render();
}

function render() {
  const rows = [...jobs.values()].filter(e => e.job && (!provider || e.job.provider.toLowerCase() === provider)).sort((a, b) => Number(b.job.id - a.job.id));
  $("count").textContent = rows.length;
  const paid = rows.filter(e => STATUS[e.job.status] === "Completed").reduce((s, e) => s + e.job.budget, 0n);
  $("paid").textContent = `${formatUnits(paid, 6)} USDC`;
  $("jobs").innerHTML = rows.map(({ job, deliverable, hash, verified }) => {
    const st = STATUS[job.status];
    const del = deliverable
      ? `<details><summary>view ${verified ? "✓" : "(unverified)"}</summary><pre>${escape(deliverable.output)}</pre><div class="sub mono">${hash}</div></details>`
      : hash ? `<span class="mono" title="${hash}">${short(hash)}</span>` : "–";
    return `<tr><td>${job.id}</td><td><span class="pill ${st}">${st}</span></td><td class="desc">${escape(job.description)}</td>
      <td>${job.budget ? formatUnits(job.budget, 6) + " USDC" : "–"}</td><td>${addrLink(job.client)} → ${addrLink(job.provider)}</td><td>${del}</td></tr>`;
  }).join("") || `<tr><td colspan="6" class="sub">No jobs in the last ${LOOKBACK} blocks${provider ? " for this provider" : ""}.</td></tr>`;
}
// Public RPCs rate-limit bursts; back off and retry.
async function withRetry(fn, tries = 5) {
  for (let i = 0; ; i++) {
    try { return await fn(); } catch (e) { if (i >= tries - 1 || !/rate limit|429|limit exceeded/i.test(e.message)) throw e; await new Promise(r => setTimeout(r, 800 * 2 ** i)); }
  }
}
const escape = (s) => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function loadReputation() {
  const agent = q.get("agent");
  if (!agent) return;
  try {
    const [count, value, dec] = await client.readContract({ address: REPUTATION, abi: repAbi, functionName: "getSummary", args: [BigInt(agent), [], "", ""] });
    const avg = count ? (Number(value) / Number(count) / 10 ** dec).toFixed(1) : "n/a";
    $("rep").textContent = `${avg} / 100`;
    const uri = await client.readContract({ address: IDENTITY, abi: idAbi, functionName: "tokenURI", args: [BigInt(agent)] });
    const m = /^data:application\/json;base64,(.+)$/.exec(uri);
    const name = m ? JSON.parse(atob(m[1])).name : "";
    $("repsub").innerHTML = `${count} review(s) · agent #${agent} ${name ? "· " + escape(name) : ""} · <a href="${explorer}/token/${IDENTITY}/instance/${agent}" target="_blank">ERC-8004</a>`;
  } catch (e) { $("rep").textContent = "–"; $("repsub").textContent = e.message; }
}

async function main() {
  if (!CONTRACT) return;
  const latest = await client.getBlockNumber();
  const fromBlock = latest > LOOKBACK ? latest - LOOKBACK : 0n;
  $("status").textContent = `Scanning blocks ${fromBlock}–${latest}…`;
  const ranges = [];
  for (let b = fromBlock; b <= latest; b += CHUNK) ranges.push([b, b + CHUNK - 1n < latest ? b + CHUNK - 1n : latest]);
  const logs = [];
  const PAR = 2;
  for (let i = 0; i < ranges.length; i += PAR) {
    const batch = await Promise.all(ranges.slice(i, i + PAR).map(([a, b]) => withRetry(() => client.getContractEvents({ address: CONTRACT, abi: acpAbi, fromBlock: a, toBlock: b }))));
    for (const l of batch) logs.push(...l);
    $("status").textContent = `Scanning… ${Math.min(i + PAR, ranges.length)}/${ranges.length} chunks, ${logs.length} events`;
  }
  logs.sort((a, b) => Number(a.blockNumber - b.blockNumber) || a.logIndex - b.logIndex);
  const ids = new Map();
  for (const l of logs) {
    if (l.eventName === "JobCreated" && provider && l.args.provider.toLowerCase() !== provider) continue;
    const id = l.args.jobId;
    if (!ids.has(id.toString())) ids.set(id.toString(), { id, hash: null });
    if (l.eventName === "JobSubmitted") ids.get(id.toString()).hash = l.args.deliverable;
    pushFeed(l, l.blockNumber, l.transactionHash);
  }
  await Promise.all([...ids.values()].map(({ id, hash }) => refreshJob(id, hash)));
  $("status").textContent = `Live · ${logs.length} events since block ${fromBlock}`;
  loadReputation();
  client.watchContractEvent({ address: CONTRACT, abi: acpAbi, fromBlock: latest + 1n, poll: true, pollingInterval: 1500, onLogs: async (ls) => {
    for (const l of ls) { pushFeed(l, l.blockNumber, l.transactionHash); await refreshJob(l.args.jobId, l.eventName === "JobSubmitted" ? l.args.deliverable : undefined); }
    if (ls.some(l => l.eventName === "JobCompleted" || l.eventName === "JobRejected")) loadReputation();
  }});
}
main().catch(e => { $("status").innerHTML = `<span class="err">${escape(e.message)}</span>`; });
</script>
</body>
</html>
